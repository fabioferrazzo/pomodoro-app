<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador Tributário + Notas</title>
    
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/lucide-react@latest"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
        body { margin: 0; background-color: #06090F; overflow: hidden; }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #06090F; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #21293A; border-radius: 10px; }
        
        /* Estilo para o texto grifado na aba de notas */
        .highlighted-text { background-color: rgba(245, 158, 11, 0.25); border-bottom: 2px solid #F59E0B; color: #fff;}
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        // Extração dos hooks do React global
        const { useState, useMemo, useEffect } = React;
        // Extração dos ícones da Lucide global
        const { Highlighter, MessageSquare, Trash2, ChevronRight, ChevronLeft } = LucideReact;

        // ═══════════════════════════════════════════════
        // COMPONENTE: BARRA LATERAL DE NOTAS (ABA NOTAS)
        // ═══════════════════════════════════════════════
        const SidebarNotes = ({ isOpen, toggle }) => {
            const [note, setNote] = useState(localStorage.getItem('tax_notes') || "");
            const [isHighlighting, setIsHighlighting] = useState(false);

            useEffect(() => {
                localStorage.setItem('tax_notes', note);
            }, [note]);

            return (
                <div className={`fixed top-0 right-0 h-full bg-[#0D1117] border-l border-[#21293A] transition-all duration-300 z-50 ${isOpen ? 'w-80' : 'w-0'}`}>
                    <button 
                        onClick={toggle}
                        className="absolute -left-8 top-1/2 bg-[#0D1117] border border-[#21293A] border-r-0 p-1 rounded-l-md text-[#94A3B8]"
                    >
                        {isOpen ? <ChevronRight size={20} /> : <ChevronLeft size={20} />}
                    </button>

                    {isOpen && (
                        <div className="p-4 h-full flex flex-col">
                            <div className="flex items-center justify-between mb-4 border-b border-[#21293A] pb-3">
                                <div className="flex items-center gap-2 text-amber-500 font-bold text-xs uppercase tracking-widest">
                                    <MessageSquare size={14} />
                                    Notas de Auditoria
                                </div>
                                <div className="flex gap-2">
                                    <button 
                                        onClick={() => setIsHighlighting(!isHighlighting)}
                                        className={`p-1.5 rounded transition-colors ${isHighlighting ? 'bg-amber-500 text-black' : 'text-slate-400 hover:bg-slate-800'}`}
                                        title={isHighlighting ? "Desativar Grifo" : "Ativar Grifo"}
                                    >
                                        <Highlighter size={16} />
                                    </button>
                                    <button onClick={() => setNote("")} className="p-1.5 text-slate-400 hover:text-red-400 transition-colors" title="Limpar notas">
                                        <Trash2 size={16} />
                                    </button>
                                </div>
                            </div>
                            
                            <textarea
                                value={note}
                                onChange={(e) => setNote(e.target.value)}
                                className={`flex-1 bg-[#151B25] border border-[#21293A] rounded p-3 text-sm text-slate-300 outline-none focus:border-amber-500/50 resize-none custom-scrollbar transition-all ${isHighlighting ? 'highlighted-text' : ''}`}
                                placeholder="Insira suas observações tributárias aqui..."
                            />
                        </div>
                    )}
                </div>
            );
        };

        // ═══════════════════════════════════════════════
        // O SEU CÓDIGO ORIGINAL INTACTO (A PARTIR DAQUI)
        // ═══════════════════════════════════════════════

        /* ─── Formatters ─── */
        const fmt = (v) => v.toLocaleString("pt-BR", { maximumFractionDigits: 0 });
        const fmtD = (v) => v.toLocaleString("pt-BR", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        const fmtPct = (v) => (v * 100).toFixed(1) + "%";

        /* ─── Theme ─── */
        const C = {
          bg: "#06090F", card: "#0D1117", cardAlt: "#151B25", surface: "#1C2333",
          border: "#21293A", borderLight: "#2D3748",
          accent: "#3B82F6", accentGlow: "rgba(59,130,246,0.10)",
          green: "#10B981", greenGlow: "rgba(16,185,129,0.08)",
          amber: "#F59E0B", amberGlow: "rgba(245,158,11,0.08)",
          red: "#EF4444", redGlow: "rgba(239,68,68,0.08)",
          purple: "#8B5CF6", purpleGlow: "rgba(139,92,246,0.08)",
          cyan: "#06B6D6", pink: "#EC4899",
          text: "#E2E8F0", textMuted: "#94A3B8", textDim: "#64748B", textFaint: "#475569",
        };

        const TAX = {
          irpj: { label: "IRPJ", color: "#3B82F6" },
          csll: { label: "CSLL", color: "#8B5CF6" },
          pis: { label: "PIS", color: "#06B6D6" },
          cofins: { label: "COFINS", color: "#10B981" },
          iss: { label: "ISS", color: "#F59E0B" },
          inss: { label: "INSS Patronal", color: "#EF4444" },
          jcp_irrf: { label: "JCP IRRF", color: "#EC4899" },
        };
        const TAX_KEYS = Object.keys(TAX);

        /* ─── IRPF 2026 (Lei 15.270/2025) ─── */
        const INSS_TETO_2026 = 8157.41;
        const INSS_SOCIO_RATE = 0.11;

        function calcINSSSocio(proLabore) {
          return Math.min(proLabore, INSS_TETO_2026) * INSS_SOCIO_RATE;
        }

        function calcIRPFMensal(proLabore) {
          const inssSocio = calcINSSSocio(proLabore);
          const base = proLabore - inssSocio;
          // Lei 15.270/2025: isenção efetiva até R$5.000 brutos
          if (proLabore <= 5000) return 0;
          // Tabela progressiva IRPF 2026
          let imposto = 0;
          if (base <= 2428.80) { imposto = 0; }
          else if (base <= 2826.65) { imposto = base * 0.075 - 182.16; }
          else if (base <= 3751.05) { imposto = base * 0.15 - 394.16; }
          else if (base <= 4664.68) { imposto = base * 0.225 - 675.83; }
          else { imposto = base * 0.275 - 908.85; }
          return Math.max(0, imposto);
        }

        /* ─── IRPFM (Imposto Mínimo) ─── */
        function calcIRPFM(rendaAnual, impostosJaPagos) {
          if (rendaAnual <= 600000) return 0;
          // Alíquota progressiva: 0% em R$600k, 10% em R$1.2M+
          const aliq = Math.min(0.10, ((rendaAnual - 600000) / 600000) * 0.10);
          const minimo = rendaAnual * aliq;
          return Math.max(0, minimo - impostosJaPagos);
        }

        /* ─── Tax Calculations ─── */
        function calcPresumido({ fat, pctExport, proLabore, nSocios, issRate }) {
          const interno = fat * (1 - pctExport);
          const excesso = Math.max(0, fat - 5000000);
          const base = Math.min(fat, 5000000) * 0.32 + excesso * 0.352;
          const irpj = base * 0.15 + Math.max(0, base - 240000) * 0.10;
          const csll = base * 0.09;
          return { irpj, csll, pis: interno * 0.0065, cofins: interno * 0.03, iss: interno * issRate, inss: proLabore * nSocios * 12 * 0.20, jcp_irrf: 0 };
        }

        function calcLucroReal({ fat, margem, pctExport, proLabore, nSocios, issRate, terceirizados, pdi, leidoBem, patente, jcpDedutivel }) {
          const interno = fat * (1 - pctExport);
          const lucroContabil = fat * margem;
          const pisD = interno * 0.0165;
          const cofD = interno * 0.076;
          const crP = Math.min(pisD + fat * pctExport * 0.0165, terceirizados * 0.0165);
          const crC = Math.min(cofD + fat * pctExport * 0.076, terceirizados * 0.076);
          let exclusao = 0;
          if (leidoBem && pdi > 0) exclusao = pdi * (patente ? 0.80 : 0.60);
          const lucroFiscal = Math.max(0, lucroContabil - exclusao - jcpDedutivel);
          const irpj = lucroFiscal * 0.15 + Math.max(0, lucroFiscal - 240000) * 0.10;
          return { irpj, csll: lucroFiscal * 0.09, pis: Math.max(0, pisD - crP), cofins: Math.max(0, cofD - crC), iss: interno * issRate, inss: proLabore * nSocios * 12 * 0.20, jcp_irrf: jcpDedutivel * 0.175 };
        }

        function totalTax(t) { return TAX_KEYS.reduce((s, k) => s + (t[k] || 0), 0); }

        /* ─── UI Atoms ─── */
        function Slider({ label, value, onChange, min, max, step, format, hint, warn }) {
          const disp = format === "money" ? "R$ " + fmt(value) : format === "pct" ? (value * 100).toFixed(0) + "%" : value;
          return (
            <div style={{ marginBottom: 15 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 2 }}>
                <span style={{ fontSize: 11, color: C.textMuted }}>{label}</span>
                <span style={{ fontSize: 12.5, fontWeight: 700, color: C.text, fontFamily: "monospace" }}>{disp}</span>
              </div>
              <input type="range" min={min} max={max} step={step} value={value} onChange={e => onChange(Number(e.target.value))} style={{ width: "100%" }} />
              {warn && <div style={{ fontSize: 9, color: C.amber, marginTop: 1 }}>{warn}</div>}
              {hint && !warn && <div style={{ fontSize: 9, color: C.textDim, marginTop: 1 }}>{hint}</div>}
            </div>
          );
        }

        function Toggle({ label, on, set, sub, disabled, tag, tagColor }) {
          return (
            <div style={{ marginBottom: 11, opacity: disabled ? 0.3 : 1, pointerEvents: disabled ? "none" : "auto" }}>
              <div onClick={() => set(!on)} style={{ display: "flex", alignItems: "center", gap: 9, cursor: "pointer" }}>
                <div style={{ width: 36, height: 19, borderRadius: 10, position: "relative", flexShrink: 0, background: on ? C.green : C.border, transition: "0.25s" }}>
                  <div style={{ width: 15, height: 15, borderRadius: 8, background: "#fff", position: "absolute", top: 2, left: on ? 19 : 2, transition: "0.2s", boxShadow: "0 1px 3px rgba(0,0,0,0.35)" }} />
                </div>
                <div style={{ flex: 1 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 5, flexWrap: "wrap" }}>
                    <span style={{ fontSize: 11.5, color: on ? C.text : C.textMuted, fontWeight: on ? 600 : 400 }}>{label}</span>
                    {tag && <span style={{ fontSize: 8, padding: "1px 4px", borderRadius: 3, background: (tagColor || C.accent) + "22", color: tagColor || C.accent, fontWeight: 700 }}>{tag}</span>}
                  </div>
                  {sub && <div style={{ fontSize: 9, color: C.textDim, marginTop: 1, lineHeight: 1.3 }}>{sub}</div>}
                </div>
              </div>
            </div>
          );
        }

        function Sec({ icon, text, color }) {
          return <div style={{ display: "flex", alignItems: "center", gap: 5, fontSize: 10, fontWeight: 800, color: color || C.accent, textTransform: "uppercase", letterSpacing: "0.08em", marginBottom: 10, marginTop: 2 }}><span>{icon}</span> {text}</div>;
        }

        function Card({ children, style: s }) {
          return <div style={{ background: C.card, borderRadius: 11, padding: 15, border: `1px solid ${C.border}`, ...s }}>{children}</div>;
        }

        function KPI({ title, value, sub, color }) {
          return (
            <div style={{ background: C.card, borderRadius: 9, padding: "10px 12px", border: `1px solid ${C.border}`, flex: 1, minWidth: 110 }}>
              <div style={{ fontSize: 8.5, color: C.textDim, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 2 }}>{title}</div>
              <div style={{ fontSize: 16, fontWeight: 800, color: color || C.text, fontFamily: "monospace" }}>{value}</div>
              {sub && <div style={{ fontSize: 8.5, color: C.textMuted, marginTop: 1 }}>{sub}</div>}
            </div>
          );
        }

        function HR() { return <div style={{ height: 1, background: C.border, margin: "12px 0" }} />; }

        function Alert({ color, glow, children }) {
          return <div style={{ background: glow, border: `1px solid ${color}33`, borderRadius: 9, padding: "10px 12px", fontSize: 10.5, color, lineHeight: 1.5, marginBottom: 7 }}>{children}</div>;
        }

        function Bar({ taxes, maxT, label, tot, pct, best }) {
          return (
            <div style={{ padding: "11px 13px", background: best ? C.greenGlow : C.card, borderRadius: 9, border: `1px solid ${best ? C.green + "55" : C.border}`, marginBottom: 7 }}>
              <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 5 }}>
                <span style={{ fontSize: 10.5, fontWeight: 600, color: C.text, flex: 1, lineHeight: 1.3 }}>{label}</span>
                <div style={{ textAlign: "right", flexShrink: 0, marginLeft: 6 }}>
                  <span style={{ fontSize: 13, fontWeight: 800, color: best ? C.green : C.text, fontFamily: "monospace" }}>R$ {fmt(tot)}</span>
                  <span style={{ fontSize: 9.5, color: best ? C.green : C.textMuted, marginLeft: 5, fontFamily: "monospace" }}>{pct}</span>
                </div>
              </div>
              <div style={{ display: "flex", height: 15, borderRadius: 4, overflow: "hidden", background: C.bg }}>
                {TAX_KEYS.map(k => { const w = maxT > 0 ? ((taxes[k] || 0) / maxT) * 100 : 0; return w > 0.3 ? <div key={k} title={`${TAX[k].label}: R$ ${fmt(taxes[k])}`} style={{ width: w + "%", background: TAX[k].color, transition: "width 0.4s", minWidth: 2 }} /> : null; })}
              </div>
            </div>
          );
        }

        function DTable({ rows, fat }) {
          return (
            <div style={{ overflowX: "auto" }}>
              <table style={{ width: "100%", borderCollapse: "collapse", fontSize: 10 }}>
                <thead><tr>
                  <th style={{ textAlign: "left", padding: "6px 7px", color: C.textDim, borderBottom: `1px solid ${C.border}`, fontSize: 9.5, position: "sticky", left: 0, background: C.card, zIndex: 1 }}>Tributo</th>
                  {rows.map((r, i) => <th key={i} style={{ textAlign: "right", padding: "6px 5px", color: C.textDim, borderBottom: `1px solid ${C.border}`, fontSize: 8.5, whiteSpace: "nowrap" }}>{r.tag}</th>)}
                </tr></thead>
                <tbody>
                  {TAX_KEYS.map(k => <tr key={k}>
                    <td style={{ padding: "4px 7px", color: C.text, borderBottom: `1px solid ${C.border}12`, whiteSpace: "nowrap", position: "sticky", left: 0, background: C.card, zIndex: 1 }}>
                      <span style={{ display: "inline-block", width: 6, height: 6, borderRadius: 2, background: TAX[k].color, marginRight: 4, verticalAlign: "middle" }} />{TAX[k].label}
                    </td>
                    {rows.map((r, i) => <td key={i} style={{ textAlign: "right", padding: "4px 5px", color: (r.taxes[k] || 0) < 1 ? C.textDim : C.text, fontFamily: "monospace", fontSize: 10, borderBottom: `1px solid ${C.border}12` }}>{(r.taxes[k] || 0) < 1 ? "—" : fmt(r.taxes[k])}</td>)}
                  </tr>)}
                  <tr>
                    <td style={{ padding: "6px 7px", fontWeight: 800, color: C.text, borderTop: `2px solid ${C.borderLight}`, position: "sticky", left: 0, background: C.card, zIndex: 1 }}>TOTAL</td>
                    {rows.map((r, i) => <td key={i} style={{ textAlign: "right", padding: "6px 5px", fontWeight: 800, color: r.best ? C.green : C.text, fontFamily: "monospace", fontSize: 11, borderTop: `2px solid ${C.borderLight}` }}>{fmt(r.tot)}</td>)}
                  </tr>
                  <tr><td style={{ padding: "3px 7px", color: C.textDim, fontSize: 9.5, position: "sticky", left: 0, background: C.card, zIndex: 1 }}>% Faturamento</td>
                    {rows.map((r, i) => <td key={i} style={{ textAlign: "right", padding: "3px 5px", color: r.best ? C.green : C.textDim, fontFamily: "monospace", fontSize: 9.5 }}>{fmtPct(r.tot / fat)}</td>)}</tr>
                  <tr><td style={{ padding: "3px 7px", color: C.textDim, fontSize: 9.5, position: "sticky", left: 0, background: C.card, zIndex: 1 }}>Economia</td>
                    {rows.map((r, i) => <td key={i} style={{ textAlign: "right", padding: "3px 5px", color: r.eco > 0 ? C.green : C.textDim, fontFamily: "monospace", fontSize: 9.5 }}>{r.eco > 0 ? `↓${fmt(r.eco)}` : "—"}</td>)}</tr>
                </tbody>
              </table>
            </div>
          );
        }

        /* ─── Partner remuneration detail row ─── */
        function RemRow({ label, value, color, bold, indent, mono }) {
          return (
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", padding: `3px ${indent ? 16 : 0}px 3px 0` }}>
              <span style={{ fontSize: 10.5, color: color || C.textMuted, fontWeight: bold ? 700 : 400 }}>{indent ? "└ " : ""}{label}</span>
              <span style={{ fontSize: mono ? 11 : 10.5, fontFamily: mono ? "monospace" : "inherit", fontWeight: bold ? 800 : 500, color: color || C.text, whiteSpace: "nowrap" }}>{value}</span>
            </div>
          );
        }

        /* ─── MAIN APP COMPONENT (SEU CÓDIGO) ─── */
        function SimuladorApp() {
          const [fat, setFat] = useState(5000000);
          const [margem, setMargem] = useState(0.275);
          const [nSocios, setNSocios] = useState(5);
          const [proLabore, setProLabore] = useState(5000);
          const [terceirizados, setTerceirizados] = useState(2000000);

          const [creative, setCreative] = useState(false);
          const [exportOn, setExportOn] = useState(false);
          const [pctExport, setPctExport] = useState(0.50);
          const [pdiOn, setPdiOn] = useState(false);
          const [pdi, setPdi] = useState(1500000);
          const [leidoBem, setLeidoBem] = useState(false);
          const [patente, setPatente] = useState(false);
          const [jcpOn, setJcpOn] = useState(false);
          const [plAtual, setPlAtual] = useState(800000);
          const [rouanet, setRouanet] = useState(false);
          const [rouanetVal, setRouanetVal] = useState(200000);

          const [view, setView] = useState("bars");
          const [section, setSection] = useState("empresa"); // empresa | socios

          const iss = creative ? 0.02 : 0.05;
          const exp = exportOn ? pctExport : 0;

          // JCP calculation
          const lucroContabil = fat * margem;
          const jcpMax = jcpOn ? Math.min(plAtual * 0.065, lucroContabil * 0.50) : 0;
          const jcpPorSocio = nSocios > 0 ? jcpMax / nSocios : 0;

          const scenarios = useMemo(() => {
            const base = { fat, margem, pctExport: 0, proLabore, nSocios };
            const opt = { fat, margem, pctExport: exp, proLabore, nSocios };
            const t1 = calcPresumido({ ...base, issRate: 0.05 });
            const t2 = calcPresumido({ ...opt, issRate: iss });
            const t3 = calcLucroReal({ ...opt, issRate: iss, terceirizados, pdi: 0, leidoBem: false, patente: false, jcpDedutivel: 0 });
            const t4 = calcLucroReal({ ...opt, issRate: iss, terceirizados, pdi: pdiOn ? pdi : 0, leidoBem, patente: leidoBem && patente, jcpDedutivel: jcpMax });
            const tots = [totalTax(t1), totalTax(t2), totalTax(t3), totalTax(t4)];
            const minT = Math.min(...tots);
            return [
              { tag: "Pres. base", label: "Presumido · ISS 5% · Sem otimizações", taxes: t1, tot: tots[0], eco: 0, best: tots[0] === minT },
              { tag: "Pres. otim.", label: `Presumido · ISS ${creative ? "2%" : "5%"}${exportOn ? " · Export" : ""}`, taxes: t2, tot: tots[1], eco: Math.max(0, tots[0] - tots[1]), best: tots[1] === minT },
              { tag: "LR s/ LdB", label: `Lucro Real · ISS ${creative ? "2%" : "5%"}`, taxes: t3, tot: tots[2], eco: Math.max(0, tots[0] - tots[2]), best: tots[2] === minT },
              { tag: "LR completo", label: `Lucro Real · Todos incentivos`, taxes: t4, tot: tots[3], eco: Math.max(0, tots[0] - tots[3]), best: tots[3] === minT },
            ];
          }, [fat, margem, nSocios, proLabore, terceirizados, exp, iss, pdiOn, pdi, leidoBem, patente, jcpMax, creative, exportOn]);

          const maxT = Math.max(...scenarios.map(s => s.tot));
          const bestS = scenarios.reduce((a, b) => a.tot < b.tot ? a : b);
          const eco = scenarios[0].tot - bestS.tot;

          /* ─── Remuneração dos Sócios (melhor cenário) ─── */
          const rem = useMemo(() => {
            const cargaPJ = bestS.tot;
            const lucroDistribuivel = Math.max(0, lucroContabil - cargaPJ);
            const lucroMesSocio = nSocios > 0 ? lucroDistribuivel / nSocios / 12 : 0;
            const jcpMes = jcpPorSocio / 12;

            // Pro-labore
            const inssSocioMes = calcINSSSocio(proLabore);
            const irpfMes = calcIRPFMensal(proLabore);
            const proLaboreLiq = proLabore - inssSocioMes - irpfMes;
            const inssPatronalMes = proLabore * 0.20;

            // Dividendos
            const excede50k = lucroMesSocio > 50000;
            const irrfDivMes = excede50k ? lucroMesSocio * 0.10 : 0;
            const divLiq = lucroMesSocio - irrfDivMes;

            // JCP
            const irrfJcpMes = jcpMes * 0.175;
            const jcpLiq = jcpMes - irrfJcpMes;

            // Total líquido mensal por sócio
            const totalBrutoMes = proLabore + lucroMesSocio + jcpMes;
            const totalLiqMes = proLaboreLiq + divLiq + jcpLiq;
            const totalEncargos = inssSocioMes + irpfMes + irrfDivMes + irrfJcpMes;

            // IRPFM anual
            const rendaAnualSocio = (proLabore + lucroMesSocio + jcpMes) * 12;
            const impostosJaPagos = (irpfMes + irrfDivMes + irrfJcpMes) * 12;
            const irpfm = calcIRPFM(rendaAnualSocio, impostosJaPagos);

            // Custo PJ total da remuneração
            const custoEmpresa = (proLabore + inssPatronalMes) * nSocios * 12;

            return {
              proLabore, inssSocioMes, irpfMes, proLaboreLiq, inssPatronalMes,
              lucroMesSocio, excede50k, irrfDivMes, divLiq,
              jcpMes, irrfJcpMes, jcpLiq,
              totalBrutoMes, totalLiqMes, totalEncargos,
              rendaAnualSocio, impostosJaPagos, irpfm,
              custoEmpresa, lucroDistribuivel,
            };
          }, [bestS.tot, lucroContabil, nSocios, proLabore, jcpPorSocio]);

          return (
            <div style={{ fontFamily: "'Inter', system-ui, sans-serif", background: C.bg, color: C.text, minHeight: "100vh", padding: "14px 12px 36px", maxWidth: 820, margin: "0 auto" }}>
              <style>{`
                input[type=range]{-webkit-appearance:none;appearance:none;height:5px;border-radius:3px;background:${C.border};outline:none;cursor:pointer}
                input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:15px;height:15px;border-radius:50%;background:${C.accent};border:2px solid ${C.bg};box-shadow:0 0 6px rgba(59,130,246,0.4)}
              `}</style>

              {/* Header */}
              <div style={{ textAlign: "center", marginBottom: 16, padding: "4px 0" }}>
                <div style={{ fontSize: 8.5, color: C.accent, textTransform: "uppercase", letterSpacing: "0.2em", fontWeight: 700, marginBottom: 2 }}>Simulador Tributário Completo</div>
                <h1 style={{ fontSize: 19, fontWeight: 900, margin: 0, lineHeight: 1.15, background: "linear-gradient(135deg, #E2E8F0, #94A3B8)", WebkitBackgroundClip: "text", WebkitTextFillColor: "transparent" }}>
                  Desenvolvedora & Publisher de Games
                </h1>
                <div style={{ fontSize: 9.5, color: C.textDim, marginTop: 3 }}>Porto Alegre/RS · Abril 2026 · Pessoa Jurídica + Pessoa Física</div>
              </div>

              {/* Section Tabs */}
              <div style={{ display: "flex", gap: 0, marginBottom: 14, background: C.card, borderRadius: 8, overflow: "hidden", border: `1px solid ${C.border}` }}>
                {[["empresa", "🏢 Empresa & Tributos PJ"], ["socios", "👥 Sócios & Remuneração"]].map(([k, lbl]) => (
                  <button key={k} onClick={() => setSection(k)} style={{
                    flex: 1, padding: "10px 0", border: "none", cursor: "pointer",
                    background: section === k ? C.accent : "transparent",
                    color: section === k ? "#fff" : C.textMuted,
                    fontSize: 10, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.03em",
                  }}>{lbl}</button>
                ))}
              </div>

              {/* SEÇÃO 1: EMPRESA & TRIBUTOS PJ */}
              {section === "empresa" && (<>
                <div style={{ display: "flex", gap: 7, marginBottom: 13, flexWrap: "wrap" }}>
                  <KPI title="Carga Base" value={fmtPct(scenarios[0].tot / fat)} sub={`R$ ${fmt(scenarios[0].tot)}`} color={C.red} />
                  <KPI title="Melhor Cenário" value={fmtPct(bestS.tot / fat)} sub={bestS.tag} color={C.green} />
                  <KPI title="Economia" value={`R$ ${fmt(eco)}`} sub={eco > 0 ? `${fmtPct(eco / fat)} do fat.` : "—"} color={C.amber} />
                </div>

                <Card style={{ marginBottom: 12 }}>
                  <Sec icon="🏢" text="Perfil da Empresa" color={C.textMuted} />
                  <Slider label="Faturamento Anual" value={fat} onChange={setFat} min={500000} max={20000000} step={100000} format="money"
                    warn={fat > 5000000 ? `⚠ LC 224/2025: majoração 10% sobre R$ ${fmt(fat - 5000000)}` : null} />
                  <Slider label="Margem de Lucro" value={margem} onChange={setMargem} min={0.05} max={0.55} step={0.005} format="pct" />
                  <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
                    <Slider label="Sócios" value={nSocios} onChange={setNSocios} min={1} max={12} step={1} />
                    <Slider label="Pró-labore/mês" value={proLabore} onChange={setProLabore} min={1412} max={30000} step={500} format="money" />
                  </div>
                  <Slider label="Terceirizados PJ" value={terceirizados} onChange={setTerceirizados} min={0} max={6000000} step={50000} format="money" hint="Créditos PIS/COFINS no Lucro Real" />
                </Card>

                <Card style={{ marginBottom: 12 }}>
                  <Sec icon="🎮" text="ISS Municipal" color={C.amber} />
                  <Toggle label="Programa Creative — ISS 2%" on={creative} set={setCreative} tag="LC 906/2021" tagColor={C.amber} sub="Porto Alegre · 10 anos · Base tecnológica" />
                  <HR />
                  <Sec icon="🌍" text="Exportação" color={C.cyan} />
                  <Toggle label="Segregar Exportação" on={exportOn} set={setExportOn} tag="LC 116/2003" tagColor={C.cyan} sub="Isenção ISS + PIS/COFINS" />
                  {exportOn && <div style={{ marginLeft: 46 }}><Slider label="% Exportação" value={pctExport} onChange={setPctExport} min={0} max={1.0} step={0.05} format="pct" hint={pctExport === 1 ? "✓ 100% — ISS e PIS/COFINS zerados" : null} /></div>}
                  <HR />
                  <Sec icon="🔬" text="PD&I e Inovação" color={C.purple} />
                  <Toggle label="Gastos PD&I qualificáveis" on={pdiOn} set={setPdiOn} tag="Lei 14.852/2024" tagColor={C.purple} sub="Marco Legal dos Games" />
                  {pdiOn && <div style={{ marginLeft: 46 }}><Slider label="Gastos PD&I" value={pdi} onChange={setPdi} min={0} max={5000000} step={50000} format="money" hint="Incerteza tecnológica + avanço" /></div>}
                  <Toggle label="Lei do Bem — Exclusão IRPJ/CSLL" on={leidoBem} set={setLeidoBem} tag="LUCRO REAL" tagColor={C.red} disabled={!pdiOn} sub={pdiOn ? "Exclusão 60% automática · Não afetada LC 224" : "→ Ative PD&I"} />
                  <Toggle label="Patente INPI" on={patente} set={setPatente} tag="+20%" tagColor={C.green} disabled={!leidoBem} sub={leidoBem ? "60% → 80%" : "→ Ative Lei do Bem"} />
                  <HR />
                  <Sec icon="🎬" text="Captação" color={C.textMuted} />
                  <Toggle label="Lei Rouanet" on={rouanet} set={setRouanet} tag="FINANCIAM." tagColor={C.textDim} sub="Games no art. 18 Lei 8.313/1991" />
                  {rouanet && <div style={{ marginLeft: 46 }}><Slider label="Captação estimada" value={rouanetVal} onChange={setRouanetVal} min={0} max={2000000} step={25000} format="money" hint="Não altera carga tributária" /></div>}
                </Card>

                <div style={{ display: "flex", gap: 0, marginBottom: 10, background: C.card, borderRadius: 7, overflow: "hidden", border: `1px solid ${C.border}` }}>
                  {[["bars", "📊 Visual"], ["table", "📋 Tabela"]].map(([k, lbl]) => (
                    <button key={k} onClick={() => setView(k)} style={{ flex: 1, padding: "8px 0", border: "none", cursor: "pointer", background: view === k ? C.accent : "transparent", color: view === k ? "#fff" : C.textMuted, fontSize: 10, fontWeight: 700, textTransform: "uppercase" }}>{lbl}</button>
                  ))}
                </div>

                {view === "bars" ? (
                  <div>
                    {scenarios.map((s, i) => <Bar key={i} taxes={s.taxes} maxT={maxT} label={s.label} tot={s.tot} pct={fmtPct(s.tot / fat)} best={s.best} />)}
                    <div style={{ display: "flex", flexWrap: "wrap", gap: 8, marginTop: 8, padding: "0 2px" }}>
                      {TAX_KEYS.map(k => <div key={k} style={{ display: "flex", alignItems: "center", gap: 3 }}><div style={{ width: 6, height: 6, borderRadius: 2, background: TAX[k].color }} /><span style={{ fontSize: 8.5, color: C.textDim }}>{TAX[k].label}</span></div>)}
                    </div>
                  </div>
                ) : (
                  <Card style={{ padding: 8 }}><DTable rows={scenarios} fat={fat} /></Card>
                )}

                <div style={{ marginTop: 12 }}>
                  {fat > 5000000 && <Alert color={C.amber} glow={C.amberGlow}><strong>⚠ LC 224/2025:</strong> Majoração 10% sobre R$ {fmt(fat - 5000000)} excedentes. ADIs 7.920/7.936 STF + liminares TRF-2/TRF-4.</Alert>}
                  {leidoBem && pdiOn && pdi > 0 && <Alert color={C.green} glow={C.greenGlow}><strong>✓ Lei do Bem:</strong> Exclusão {patente ? "80%" : "60%"} × R$ {fmt(pdi)} = R$ {fmt(pdi * (patente ? 0.80 : 0.60))}. Preservada integralmente (IN RFB 31/12/2025).</Alert>}
                  {exportOn && pctExport === 1 && <Alert color={C.purple} glow={C.purpleGlow}><strong>100% Export:</strong> ISS + PIS/COFINS zerados. Risco médio-alto — comprovação robusta exigida.</Alert>}
                  {!creative && <Alert color={C.accent} glow={C.accentGlow}><strong>💡</strong> Ative o Creative: ~R$ {fmt(fat * (1 - exp) * 0.03)}/ano de economia imediata.</Alert>}
                </div>
              </>)}

              {/* SEÇÃO 2: SÓCIOS & REMUNERAÇÃO */}
              {section === "socios" && (<>
                <div style={{ display: "flex", gap: 7, marginBottom: 13, flexWrap: "wrap" }}>
                  <KPI title="Bruto/mês (sócio)" value={`R$ ${fmt(rem.totalBrutoMes)}`} sub="Pró-labore + Lucros + JCP" />
                  <KPI title="Líquido/mês (sócio)" value={`R$ ${fmt(rem.totalLiqMes)}`} sub={`${fmtPct(rem.totalLiqMes / (rem.totalBrutoMes || 1))} do bruto`} color={C.green} />
                  <KPI title="Encargos/mês (sócio)" value={`R$ ${fmt(rem.totalEncargos)}`} sub="INSS + IRPF + IRRF" color={C.red} />
                </div>

                <Card style={{ marginBottom: 12 }}>
                  <Sec icon="💼" text="Pró-labore" color={C.amber} />
                  <Slider label="Pró-labore mensal (por sócio)" value={proLabore} onChange={setProLabore} min={1412} max={30000} step={500} format="money"
                    hint={`${nSocios} sócios · Total anual: R$ ${fmt(proLabore * nSocios * 12)}`}
                    warn={proLabore < 3000 ? "⚠ Abaixo de R$ 3.000 pode ser questionado pela RFB" : null} />
                  <Slider label="Número de sócios" value={nSocios} onChange={setNSocios} min={1} max={12} step={1}
                    hint={`Lucro dividido por ${nSocios}: R$ ${fmt(rem.lucroMesSocio)}/mês cada`} />
                  <HR />
                  <Sec icon="💰" text="JCP — Juros sobre Capital Próprio" color={C.pink} />
                  <Toggle label="Ativar JCP" on={jcpOn} set={setJcpOn} tag="LUCRO REAL" tagColor={C.red}
                    sub="Dedutível no IRPJ/CSLL · IRRF 17,5% · LC 224/2025 + IN 2.296/2025" />
                  {jcpOn && <div style={{ marginLeft: 46 }}>
                    <Slider label="Patrimônio Líquido" value={plAtual} onChange={setPlAtual} min={100000} max={5000000} step={50000} format="money"
                      hint={`JCP máx: R$ ${fmt(jcpMax)}/ano (TJLP 6,5% × PL, até 50% lucro)`} />
                  </div>}
                </Card>

                <Card style={{ marginBottom: 12 }}>
                  <Sec icon="👤" text={`Demonstrativo Mensal — 1 sócio (de ${nSocios})`} color={C.accent} />
                  <div style={{ background: C.bg, borderRadius: 8, padding: "12px 14px", marginBottom: 10 }}>
                    <div style={{ fontSize: 9, color: C.accent, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 8 }}>Pró-labore</div>
                    <RemRow label="Bruto" value={`R$ ${fmtD(proLabore)}`} bold mono />
                    <RemRow label="INSS do sócio (11%)" value={`- R$ ${fmtD(rem.inssSocioMes)}`} color={C.red} indent mono />
                    <RemRow label="IRPF na fonte" value={rem.irpfMes > 0 ? `- R$ ${fmtD(rem.irpfMes)}` : "isento"} color={rem.irpfMes > 0 ? C.red : C.green} indent mono />
                    <div style={{ height: 1, background: C.border, margin: "6px 0" }} />
                    <RemRow label="Pró-labore líquido" value={`R$ ${fmtD(rem.proLaboreLiq)}`} bold color={C.text} mono />
                  </div>

                  <div style={{ background: C.bg, borderRadius: 8, padding: "12px 14px", marginBottom: 10 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: 8 }}>
                      <div style={{ fontSize: 9, color: C.green, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.06em" }}>Distribuição de Lucros</div>
                      {rem.excede50k && <span style={{ fontSize: 8, padding: "2px 5px", borderRadius: 3, background: C.redGlow, color: C.red, fontWeight: 700 }}>ACIMA R$50K</span>}
                    </div>
                    <RemRow label="Lucro distribuível/mês" value={`R$ ${fmtD(rem.lucroMesSocio)}`} bold mono />
                    {rem.excede50k ? (
                      <RemRow label="IRRF 10% (Lei 15.270/2025)" value={`- R$ ${fmtD(rem.irrfDivMes)}`} color={C.red} indent mono />
                    ) : (
                      <RemRow label="IRRF" value="isento (≤ R$ 50k/mês)" color={C.green} indent />
                    )}
                    <div style={{ height: 1, background: C.border, margin: "6px 0" }} />
                    <RemRow label="Lucros líquidos" value={`R$ ${fmtD(rem.divLiq)}`} bold color={rem.excede50k ? C.amber : C.green} mono />
                  </div>

                  {jcpOn && jcpMax > 0 && (
                    <div style={{ background: C.bg, borderRadius: 8, padding: "12px 14px", marginBottom: 10 }}>
                      <div style={{ fontSize: 9, color: C.pink, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 8 }}>JCP — Juros sobre Capital Próprio</div>
                      <RemRow label="JCP bruto/mês" value={`R$ ${fmtD(rem.jcpMes)}`} bold mono />
                      <RemRow label="IRRF 17,5%" value={`- R$ ${fmtD(rem.irrfJcpMes)}`} color={C.red} indent mono />
                      <div style={{ height: 1, background: C.border, margin: "6px 0" }} />
                      <RemRow label="JCP líquido" value={`R$ ${fmtD(rem.jcpLiq)}`} bold color={C.pink} mono />
                    </div>
                  )}

                  <div style={{ background: "linear-gradient(135deg, rgba(16,185,129,0.08), rgba(59,130,246,0.08))", borderRadius: 8, padding: "12px 14px", border: `1px solid ${C.green}33` }}>
                    <div style={{ fontSize: 9, color: C.green, fontWeight: 700, textTransform: "uppercase", letterSpacing: "0.06em", marginBottom: 8 }}>Total Mensal — Sócio</div>
                    <RemRow label="Remuneração bruta" value={`R$ ${fmtD(rem.totalBrutoMes)}`} bold mono />
                    <RemRow label="Total encargos/retenções" value={`- R$ ${fmtD(rem.totalEncargos)}`} color={C.red} mono />
                    <div style={{ height: 1, background: C.borderLight, margin: "6px 0" }} />
                    <RemRow label="LÍQUIDO RECEBIDO" value={`R$ ${fmtD(rem.totalLiqMes)}`} bold color={C.green} mono />
                    <div style={{ marginTop: 6 }}>
                      <RemRow label="Carga efetiva sobre remuneração" value={fmtPct(rem.totalEncargos / (rem.totalBrutoMes || 1))} color={C.amber} />
                    </div>
                  </div>
                </Card>

                <Card style={{ marginBottom: 12 }}>
                  <Sec icon="🏢" text="Custo para a Empresa (todos os sócios)" color={C.textMuted} />
                  <div style={{ background: C.bg, borderRadius: 8, padding: "12px 14px" }}>
                    <RemRow label={`Pró-labore total (${nSocios} × R$ ${fmt(proLabore)})`} value={`R$ ${fmt(proLabore * nSocios * 12)}/ano`} mono />
                    <RemRow label="INSS Patronal (20%)" value={`R$ ${fmt(proLabore * 0.20 * nSocios * 12)}/ano`} color={C.red} indent mono />
                    {jcpOn && jcpMax > 0 && <>
                      <RemRow label="JCP total distribuído" value={`R$ ${fmt(jcpMax)}/ano`} mono />
                      <RemRow label="IRRF JCP retido (17,5%)" value={`R$ ${fmt(jcpMax * 0.175)}/ano`} color={C.red} indent mono />
                      <RemRow label="Economia IRPJ/CSLL pela dedução" value={`R$ ${fmt(jcpMax * 0.34)}/ano`} color={C.green} indent mono />
                      <RemRow label="Economia líquida JCP" value={`R$ ${fmt(jcpMax * (0.34 - 0.175))}/ano`} color={C.green} bold mono />
                    </>}
                    <div style={{ height: 1, background: C.border, margin: "8px 0" }} />
                    <RemRow label="Custo total pró-labore + encargos" value={`R$ ${fmt(rem.custoEmpresa)}/ano`} bold mono />
                  </div>
                </Card>

                <Card style={{ marginBottom: 12 }}>
                  <Sec icon="🎯" text="IRPF Mínimo — Lei 15.270/2025" color={C.purple} />
                  <div style={{ background: C.bg, borderRadius: 8, padding: "12px 14px" }}>
                    <RemRow label="Renda global anual (por sócio)" value={`R$ ${fmt(rem.rendaAnualSocio)}`} bold mono />
                    <RemRow label="Impostos já pagos na fonte" value={`R$ ${fmt(rem.impostosJaPagos)}`} indent mono />
                    {rem.rendaAnualSocio > 600000 ? (<>
                      <RemRow label="Alíquota mínima efetiva" value={fmtPct(Math.min(0.10, (rem.rendaAnualSocio - 600000) / 600000 * 0.10))} color={C.amber} indent />
                      <RemRow label="Tributo mínimo calculado" value={`R$ ${fmt(rem.rendaAnualSocio * Math.min(0.10, (rem.rendaAnualSocio - 600000) / 600000 * 0.10))}`} indent mono />
                      <div style={{ height: 1, background: C.border, margin: "6px 0" }} />
                      <RemRow label={rem.irpfm > 0 ? "IRPFM A PAGAR (complemento)" : "IRPFM — Já coberto"} value={rem.irpfm > 0 ? `R$ ${fmt(rem.irpfm)}/ano` : "R$ 0"} bold color={rem.irpfm > 0 ? C.red : C.green} mono />
                    </>) : (
                      <div style={{ marginTop: 6 }}>
                        <RemRow label="Status" value="Abaixo de R$ 600k/ano — Não se aplica" color={C.green} />
                      </div>
                    )}
                  </div>
                  <div style={{ fontSize: 9, color: C.textDim, marginTop: 8, lineHeight: 1.4 }}>
                    O IRPFM incide quando a renda global anual excede R$ 600 mil, com alíquota progressiva de 0% a 10% (teto em R$ 1,2M+). Tributos já pagos (IRPF fonte, IRRF dividendos, IRRF JCP) são creditados. O complemento, se houver, é recolhido na declaração anual (DIRPF 2027, ref. 2026).
                  </div>
                </Card>

                <div>
                  {rem.excede50k && (
                    <Alert color={C.red} glow={C.redGlow}>
                      <strong>⚠ Dividendos &gt; R$ 50k/mês:</strong> ~R$ {fmt(rem.lucroMesSocio)}/mês por sócio. IRRF 10% sobre o <em>total</em> distribuído no mês (não apenas o excedente). Considerar: aumentar nº de sócios, escalonar distribuições, ou constituir holding.
                    </Alert>
                  )}
                  {rem.irpfm > 0 && (
                    <Alert color={C.purple} glow={C.purpleGlow}>
                      <strong>IRPFM ativo:</strong> Renda global de R$ {fmt(rem.rendaAnualSocio)}/ano gera complemento de R$ {fmt(rem.irpfm)}/ano por sócio.
                      Total {nSocios} sócios: R$ {fmt(rem.irpfm * nSocios)}/ano.
                    </Alert>
                  )}
                  {!rem.excede50k && rem.rendaAnualSocio <= 600000 && (
                    <Alert color={C.green} glow={C.greenGlow}>
                      <strong>✓ Cenário otimizado:</strong> Dividendos abaixo de R$ 50k/mês e renda global abaixo de R$ 600k/ano.
                      Sem IRRF sobre lucros e sem IRPFM. Calibragem ideal de pró-labore + distribuição.
                    </Alert>
                  )}
                  {proLabore < 3000 && (
                    <Alert color={C.amber} glow={C.amberGlow}>
                      <strong>⚠ Pró-labore baixo:</strong> R$ {fmt(proLabore)}/mês pode ser questionado pela RFB como incompatível com a atividade. Recomendação: mínimo de R$ 3.000-5.000 para sócios de empresa de R$ {fmt(fat)} de faturamento.
                    </Alert>
                  )}
                  {jcpOn && (
                    <Alert color={C.pink} glow="rgba(236,72,153,0.08)">
                      <strong>JCP:</strong> Economia líquida de R$ {fmt(jcpMax * (0.34 - 0.175))}/ano para a empresa. Cada sócio recebe R$ {fmtD(rem.jcpLiq)}/mês líquido. IN 2.296/2025: lucros do exercício corrente não entram na base.
                    </Alert>
                  )}
                </div>
              </>)}

              {/* ── Premissas (ambas seções) ── */}
              <div style={{ background: C.cardAlt, borderRadius: 9, padding: "11px 13px", border: `1px solid ${C.border}`, marginTop: 14, fontSize: 9, color: C.textDim, lineHeight: 1.65 }}>
                <div style={{ fontWeight: 800, color: C.textMuted, marginBottom: 4, fontSize: 8, textTransform: "uppercase", letterSpacing: "0.06em" }}>Base Legal</div>
                <div>• Presumido 32%: SC COSIT 36/2023 · PIS 0,65% + COFINS 3% · LC 224/2025 (majoração 10% &gt; R$5M)</div>
                <div>• Lucro Real: PIS 1,65% + COFINS 7,6% não-cumulativos · Créditos sobre terceirizados</div>
                <div>• Lei do Bem: Lei 11.196/2005 · 60-80% exclusão · <span style={{ color: C.green }}>Preservada (IN RFB 31/12/2025)</span></div>
                <div>• ISS: STF ADIs 1.945/5.659 · Creative LC 906/2021 · Export LC 116/2003</div>
                <div>• Dividendos: Lei 15.270/2025 · Isentos até R$ 50k/mês · IRRF 10% sobre total acima</div>
                <div>• IRPFM: Lei 15.270/2025 · Renda &gt; R$ 600k/ano · Progressivo até 10% (R$ 1,2M)</div>
                <div>• INSS sócio: 11% até teto R$ {fmt(INSS_TETO_2026)} · Patronal 20% · JCP: IRRF 17,5% LC 224/2025</div>
                <div>• IRPF 2026: tabela progressiva + isenção efetiva até R$ 5.000 (Lei 15.270/2025)</div>
                <div style={{ marginTop: 4, fontStyle: "italic", color: C.textFaint }}>Simulação para planejamento. Requer validação contábil e parecer tributarista.</div>
              </div>
            </div>
          );
        }

        // ═══════════════════════════════════════════════
        // ESTRUTURA PRINCIPAL (LAYOUT COM BARRA LATERAL)
        // ═══════════════════════════════════════════════
        function MainApp() {
            const [isSidebarOpen, setIsSidebarOpen] = useState(true);

            return (
                <div className="flex h-screen overflow-hidden">
                    <div className={`flex-1 overflow-y-auto custom-scrollbar transition-all duration-300 ${isSidebarOpen ? 'mr-80' : 'mr-0'}`}>
                        <SimuladorApp />
                    </div>
                    <SidebarNotes isOpen={isSidebarOpen} toggle={() => setIsSidebarOpen(!isSidebarOpen)} />
                </div>
            );
        }

        // Renderização Final
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MainApp />);
    </script>
</body>
</html>
