<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pomodoro Minimalista</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#bb2246">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        :root { --bg-color: #bb2246; --card-bg: #ffffff; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); transition: background 0.5s; overflow: hidden; }
        
        /* Sidebar de Notas */
        #sidebar-notes {
            transition: transform 0.3s ease-in-out;
            transform: translateX(100%);
        }
        #sidebar-notes.open { transform: translateX(0); }
        
        .timer-text { font-variant-numeric: tabular-nums; font-family: monospace; }
        .dyn-bg { background-color: var(--card-bg); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Header -->
    <header class="w-full max-w-xl flex justify-between items-center mb-6 text-white">
        <h1 class="text-2xl font-bold flex items-center gap-2"><i class="ph-fill ph-timer"></i> Pomodoro</h1>
        <button id="install-btn" class="hidden bg-white/20 px-4 py-2 rounded-full text-sm">Instalar</button>
    </header>

    <!-- App Principal -->
    <main class="dyn-bg w-full max-w-xl rounded-[2rem] shadow-2xl p-8 flex flex-col items-center relative z-10">
        <!-- Modos -->
        <div class="flex gap-2 bg-stone-100 p-1.5 rounded-full mb-8 w-full">
            <button onclick="setMode('pomodoro')" id="btn-pomo" class="flex-1 py-2 rounded-full text-sm font-bold bg-white shadow-sm">Pomodoro</button>
            <button onclick="setMode('shortBreak')" id="btn-short" class="flex-1 py-2 rounded-full text-sm font-medium text-stone-500">Pausa</button>
        </div>

        <!-- Timer -->
        <div id="timer-display" class="text-[8rem] font-bold tracking-tighter mb-8 timer-text text-stone-800">25:00</div>

        <!-- Controlos -->
        <div class="flex items-center gap-6 mb-8">
            <button onclick="resetTimer()" class="text-stone-400 text-3xl hover:text-stone-600"><i class="ph ph-arrow-counter-clockwise"></i></button>
            <button onclick="toggleTimer()" id="btn-start" class="w-20 h-20 rounded-full text-white text-4xl shadow-xl flex items-center justify-center" style="background-color: var(--bg-color);">
                <i id="play-icon" class="ph-fill ph-play ml-1"></i>
            </button>
            <button onclick="togglePiP()" class="text-stone-400 text-3xl hover:text-stone-600"><i class="ph ph-picture-in-picture"></i></button>
        </div>

        <!-- Abas Inferiores -->
        <nav class="w-full flex border-t border-stone-100 pt-6 gap-4">
            <button onclick="switchTab('audio')" class="flex-1 flex flex-col items-center gap-1 text-stone-400 hover:text-stone-800">
                <i class="ph-fill ph-microphone text-2xl"></i><span class="text-xs font-bold">Lembretes</span>
            </button>
            <button onclick="openSidebar()" class="flex-1 flex flex-col items-center gap-1 text-stone-400 hover:text-stone-800">
                <i class="ph-fill ph-notebook text-2xl"></i><span class="text-xs font-bold">Notas</span>
            </button>
            <button onclick="switchTab('settings')" class="flex-1 flex flex-col items-center gap-1 text-stone-400 hover:text-stone-800">
                <i class="ph-fill ph-gear text-2xl"></i><span class="text-xs font-bold">Ajustes</span>
            </button>
        </nav>

        <!-- Container de Ajustes (Aparece aqui) -->
        <div id="tab-settings" class="hidden w-full mt-6 border-t pt-4">
            <h4 class="text-xs font-bold text-stone-400 uppercase mb-4">Configurar Tempos</h4>
            <div class="space-y-3">
                <div class="flex justify-between items-center bg-stone-50 p-3 rounded-xl">
                    <span class="text-sm">Pomodoro (min)</span>
                    <input type="number" id="in-pomo" class="w-16 bg-transparent text-right font-bold outline-none" value="25">
                </div>
                <div class="flex justify-between items-center bg-stone-50 p-3 rounded-xl">
                    <span class="text-sm">Pausa (min)</span>
                    <input type="number" id="in-short" class="w-16 bg-transparent text-right font-bold outline-none" value="5">
                </div>
                <button onclick="saveSettings()" id="btn-save" class="w-full py-3 rounded-xl text-white font-bold transition-all" style="background-color: var(--bg-color);">Guardar Tempos</button>
            </div>
        </div>
    </main>

    <!-- SIDEBAR DE NOTAS (NOVO LAYOUT) -->
    <aside id="sidebar-notes" class="fixed top-0 right-0 h-full w-full max-w-md bg-white shadow-2xl z-[100] p-6 flex flex-col">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold flex items-center gap-2"><i class="ph ph-notebook"></i> Minhas Notas</h2>
            <button onclick="closeSidebar()" class="text-2xl text-stone-400 hover:text-stone-800"><i class="ph ph-x"></i></button>
        </div>
        <div class="flex gap-2 mb-4 border-b pb-2">
            <button onclick="format('bold')" class="p-2 hover:bg-stone-100 rounded"><b>B</b></button>
            <button onclick="format('italic')" class="p-2 hover:bg-stone-100 rounded"><i>I</i></button>
            <button class="p-2 hover:bg-stone-100 rounded ml-auto text-sm flex items-center gap-1 bg-stone-50">
                <i class="ph ph-paperclip"></i> Anexar
            </button>
        </div>
        <div id="editor" contenteditable="true" class="flex-1 outline-none text-stone-700 leading-relaxed overflow-y-auto" placeholder="Comece a escrever..."></div>
    </aside>

    <script>
        // --- PERSISTÊNCIA E CONFIGURAÇÕES ---
        let MODES = JSON.parse(localStorage.getItem('pomo_cfg')) || { pomodoro: 25, shortBreak: 5 };
        let timeLeft = MODES.pomodoro * 60;
        let timerId = null;
        let isRunning = false;

        function saveSettings() {
            MODES.pomodoro = parseInt(document.getElementById('in-pomo').value);
            MODES.shortBreak = parseInt(document.getElementById('in-short').value);
            localStorage.setItem('pomo_cfg', JSON.stringify(MODES));
            
            const btn = document.getElementById('btn-save');
            btn.style.backgroundColor = "#10b981"; // Verde sucesso
            btn.textContent = "Guardado!";
            setTimeout(() => { 
                btn.style.backgroundColor = "var(--bg-color)"; 
                btn.textContent = "Guardar Tempos";
            }, 2000);
            
            resetTimer(); // Aplica o novo tempo imediatamente
        }

        function updateDisplay() {
            const min = Math.floor(timeLeft / 60);
            const sec = timeLeft % 60;
            const timeStr = `${min.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
            document.getElementById('timer-display').textContent = timeStr;
            document.title = timeStr + " - Pomodoro";
        }

        function toggleTimer() {
            if (isRunning) {
                clearInterval(timerId);
                document.getElementById('play-icon').className = "ph-fill ph-play ml-1";
            } else {
                timerId = setInterval(() => {
                    timeLeft--;
                    updateDisplay();
                    if (timeLeft <= 0) { clearInterval(timerId); alert("Acabou!"); }
                }, 1000);
                document.getElementById('play-icon').className = "ph-fill ph-pause";
            }
            isRunning = !isRunning;
        }

        function resetTimer() {
            clearInterval(timerId);
            isRunning = false;
            timeLeft = MODES.pomodoro * 60;
            updateDisplay();
            document.getElementById('play-icon').className = "ph-fill ph-play ml-1";
        }

        // --- SIDEBAR E ABAS ---
        function openSidebar() { document.getElementById('sidebar-notes').classList.add('open'); }
        function closeSidebar() { document.getElementById('sidebar-notes').classList.remove('open'); }
        
        function switchTab(id) {
            const tab = document.getElementById('tab-settings');
            if (id === 'settings') tab.classList.toggle('hidden');
            else tab.classList.add('hidden');
        }

        // --- INICIALIZAÇÃO ---
        document.getElementById('in-pomo').value = MODES.pomodoro;
        document.getElementById('in-short').value = MODES.shortBreak;
        updateDisplay();
    </script>
</body>
</html>
