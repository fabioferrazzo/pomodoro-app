<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pomodoro Pro</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#bb2246">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
        :root { --bg-color: #bb2246; --card-bg: #ffffff; }
        body { font-family: 'Inter', sans-serif; background-color: var(--bg-color); transition: background 0.5s; overflow: hidden; }
        #sidebar-notes { transition: transform 0.3s; transform: translateX(100%); }
        #sidebar-notes.open { transform: translateX(0); }
        .timer-text { font-variant-numeric: tabular-nums; }
        .dark-card { --card-bg: #1c1917; color: white !important; }
        /* Brilho de alerta */
        @keyframes alert-pulse { 0% { background-color: #dc2626; } 50% { background-color: #991b1b; } 100% { background-color: #dc2626; } }
        .bg-alert { animation: alert-pulse 1.5s infinite; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4" id="app-body">

    <main id="main-card" class="bg-white w-full max-w-xl rounded-[2.5rem] shadow-2xl p-8 flex flex-col items-center relative z-10">
        <div id="timer-display" class="text-[8rem] font-bold tracking-tighter mb-8 text-stone-800 timer-text">25:00</div>

        <div class="flex items-center gap-6 mb-8">
            <button onclick="resetTimer()" class="text-stone-400 text-3xl hover:text-stone-600"><i class="ph ph-arrow-counter-clockwise"></i></button>
            <button onclick="toggleTimer()" id="btn-start" class="w-20 h-20 rounded-full text-white text-4xl shadow-xl flex items-center justify-center transition-all" style="background-color: var(--bg-color);">
                <i id="play-icon" class="ph-fill ph-play ml-1"></i>
            </button>
            <button onclick="togglePiP()" class="text-stone-400 text-3xl hover:text-stone-600"><i class="ph ph-browsers"></i></button>
        </div>

        <nav class="w-full flex border-t pt-6 gap-4">
            <button onclick="openVoiceModal()" class="flex-1 flex flex-col items-center gap-1 text-stone-400 hover:text-stone-800">
                <i class="ph-fill ph-microphone text-2xl"></i><span class="text-xs font-bold">Lembrete</span>
            </button>
            <button onclick="openSidebar()" class="flex-1 flex flex-col items-center gap-1 text-stone-400 hover:text-stone-800">
                <i class="ph-fill ph-notebook text-2xl"></i><span class="text-xs font-bold">Notas</span>
            </button>
            <button onclick="document.getElementById('tab-settings').classList.toggle('hidden')" class="flex-1 flex flex-col items-center gap-1 text-stone-400 hover:text-stone-800">
                <i class="ph-fill ph-gear text-2xl"></i><span class="text-xs font-bold">Ajustes</span>
            </button>
        </nav>

        <div id="tab-settings" class="hidden w-full mt-6 border-t pt-4 space-y-2">
            <div class="grid grid-cols-2 gap-2">
                <input type="number" id="in-pomo" class="bg-stone-50 p-2 rounded text-sm" placeholder="Foco (min)">
                <input type="color" id="color-bg" class="w-full h-8 cursor-pointer rounded">
            </div>
            <button onclick="saveSettings()" class="w-full py-2 bg-stone-800 text-white rounded font-bold text-xs">Guardar</button>
        </div>
    </main>

    <!-- Modal Lembrete -->
    <div id="voice-modal" class="fixed inset-0 bg-black/50 hidden z-[110] flex items-center justify-center p-4">
        <div class="bg-white p-6 rounded-[2rem] w-full max-w-sm flex flex-col shadow-2xl">
            <h3 class="text-xl font-bold mb-4 text-center">Agendar com Título</h3>
            
            <input type="text" id="rem-title" class="w-full bg-stone-50 p-3 rounded-xl mb-4 text-sm font-semibold outline-none focus:ring-2 focus:ring-purple-400" placeholder="Ex: Ligar para o cliente">
            
            <div class="grid grid-cols-2 gap-2 mb-4">
                <input type="number" id="rem-min" class="bg-stone-50 p-3 rounded-xl text-center font-bold text-sm" value="5">
                <input type="datetime-local" id="rem-date" class="bg-stone-50 p-3 rounded-xl text-[10px] font-bold">
            </div>

            <button onclick="toggleRecording()" id="rec-btn" class="w-16 h-16 rounded-full bg-purple-600 text-white text-2xl mx-auto mb-2 flex items-center justify-center shadow-lg active:scale-95 transition-all">
                <i id="rec-icon" class="ph-fill ph-microphone"></i>
            </button>
            <p id="rec-status" class="text-[10px] text-stone-500 mb-6 text-center">Clique para gravar áudio</p>
            
            <div class="flex gap-2">
                <button onclick="closeVoiceModal()" class="flex-1 py-3 bg-stone-100 rounded-xl font-bold text-xs">Cancelar</button>
                <button id="save-rec" disabled onclick="saveReminder()" class="flex-1 py-3 bg-purple-600 text-white rounded-xl font-bold text-xs opacity-50">Agendar</button>
            </div>
        </div>
    </div>

    <!-- TELA DE ALERTA DE SOBREPOSIÇÃO -->
    <div id="alert-screen" class="fixed inset-0 bg-alert hidden z-[200] flex flex-col items-center justify-center text-white p-8">
        <i class="ph-fill ph-bell-ringing text-8xl mb-6 animate-bounce"></i>
        <h2 id="alert-msg-title" class="text-4xl font-bold mb-2 text-center">TITULO</h2>
        <p class="mb-10 text-xl opacity-80">Seu lembrete de voz chegou!</p>
        
        <button onclick="playReminderAudio()" class="w-full max-w-xs py-5 bg-white text-red-600 rounded-2xl font-bold mb-4 shadow-2xl flex items-center justify-center gap-3 text-xl hover:scale-105 active:scale-95 transition-all">
            <i class="ph-fill ph-play-circle text-3xl"></i> OUVIR AGORA
        </button>
        
        <div class="flex gap-4 w-full max-w-xs">
            <button onclick="snoozeReminder()" class="flex-1 py-4 bg-red-900/50 border border-white/20 rounded-xl font-bold text-sm hover:bg-red-900 transition-all">Soneca (10m)</button>
            <button onclick="closeAlert()" class="flex-1 py-4 bg-stone-900/40 rounded-xl font-bold text-sm hover:bg-stone-950 transition-all">Fechar</button>
        </div>
    </div>

    <canvas id="pip-canvas" width="300" height="300" class="hidden"></canvas>
    <video id="pip-video" class="hidden" muted autoplay playsinline></video>

    <script>
        let MODES = JSON.parse(localStorage.getItem('pomo_cfg')) || { pomodoro: 25 };
        let reminders = JSON.parse(localStorage.getItem('pomo_rem')) || [];
        let timeLeft = MODES.pomodoro * 60, timerId = null, isRunning = false;
        let mediaRecorder, chunks = [], audioBase64 = null, activeRem = null;

        // Registrar SW e Pedir Permissão
        if ('serviceWorker' in navigator) { 
            navigator.serviceWorker.register('sw.js'); 
            Notification.requestPermission();
        }

        function updateDisplay() {
            const min = Math.floor(timeLeft / 60), sec = timeLeft % 60;
            const str = `${min.toString().padStart(2,'0')}:${sec.toString().padStart(2,'0')}`;
            document.getElementById('timer-display').textContent = str;
        }

        function toggleTimer() {
            if(isRunning) clearInterval(timerId);
            else timerId = setInterval(() => { timeLeft--; updateDisplay(); if(timeLeft<=0) resetTimer(); }, 1000);
            isRunning = !isRunning;
            document.getElementById('play-icon').className = isRunning ? "ph-fill ph-pause" : "ph-fill ph-play ml-1";
        }

        function resetTimer() { clearInterval(timerId); isRunning = false; timeLeft = MODES.pomodoro * 60; updateDisplay(); }

        // --- VOZ ---
        async function toggleRecording() {
            if(!mediaRecorder || mediaRecorder.state === 'inactive') {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream); chunks = [];
                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                mediaRecorder.onstop = () => {
                    const reader = new FileReader();
                    reader.readAsDataURL(new Blob(chunks));
                    reader.onloadend = () => { 
                        audioBase64 = reader.result; 
                        document.getElementById('save-rec').disabled = false;
                        document.getElementById('save-rec').classList.remove('opacity-50');
                    };
                };
                mediaRecorder.start();
                document.getElementById('rec-icon').className = "ph-fill ph-stop";
                document.getElementById('rec-status').textContent = "A gravar...";
            } else {
                mediaRecorder.stop();
                document.getElementById('rec-icon').className = "ph-fill ph-microphone";
                document.getElementById('rec-status').textContent = "Pronto!";
                mediaRecorder.stream.getTracks().forEach(t => t.stop());
            }
        }

        function saveReminder() {
            const title = document.getElementById('rem-title').value || "Lembrete de Voz";
            const date = document.getElementById('rem-date').value;
            const trigger = date ? new Date(date).getTime() : Date.now() + (document.getElementById('rem-min').value * 60000);
            
            reminders.push({ id: Date.now(), title, audio: audioBase64, time: trigger });
            localStorage.setItem('pomo_rem', JSON.stringify(reminders));
            audioBase64 = null; closeVoiceModal();
        }

        // VERIFICADOR DE SEGUNDO PLANO
        setInterval(() => {
            const now = Date.now();
            reminders.forEach((rem, idx) => {
                if(now >= rem.time) {
                    // 1. Notificação de Sistema (Banner Windows/Android)
                    if (Notification.permission === "granted") {
                        navigator.serviceWorker.ready.then(reg => {
                            reg.showNotification(rem.title, {
                                body: 'Toque para ouvir a mensagem gravada!',
                                icon: 'icon.png',
                                tag: 'pomo-' + rem.id,
                                requireInteraction: true
                            });
                        });
                    }
                    // 2. Sobreposição Interna
                    activeRem = rem;
                    document.getElementById('alert-msg-title').textContent = rem.title;
                    document.getElementById('alert-screen').classList.remove('hidden');
                    
                    reminders.splice(idx, 1);
                    localStorage.setItem('pomo_rem', JSON.stringify(reminders));
                }
            });
        }, 5000);

        function playReminderAudio() { if(activeRem) new Audio(activeRem.audio).play(); }
        
        function snoozeReminder() {
            if(activeRem) {
                activeRem.time = Date.now() + (10 * 60000);
                reminders.push(activeRem);
                localStorage.setItem('pomo_rem', JSON.stringify(reminders));
                closeAlert();
            }
        }

        function closeAlert() { document.getElementById('alert-screen').classList.add('hidden'); activeRem = null; }
        function openVoiceModal() { document.getElementById('voice-modal').classList.remove('hidden'); }
        function closeVoiceModal() { document.getElementById('voice-modal').classList.add('hidden'); }
        function openSidebar() { document.getElementById('sidebar-notes').classList.add('open'); }
        function closeSidebar() { document.getElementById('sidebar-notes').classList.remove('open'); }

        updateDisplay();
    </script>
</body>
</html>
