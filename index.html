<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pomodoro Minimalista</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#f5f5f4">
    <link rel="apple-touch-icon" href="icon.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; transition: background-color 0.5s ease; overflow-x: hidden; }
        button, input { transition: all 0.2s ease-in-out; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        #editor[contenteditable="true"]:empty:before { content: attr(placeholder); color: #a8a29e; pointer-events: none; display: block; }
    </style>
</head>
<body class="bg-stone-100 min-h-screen flex items-center justify-center text-stone-800 transition-colors duration-500" id="app-body">

    <main id="main-card" class="bg-white p-6 sm:p-10 rounded-[2.5rem] shadow-xl border border-stone-100 w-full max-lg mx-4 flex flex-col items-center z-10 relative">
        
        <header class="w-full flex flex-col sm:flex-row justify-between items-start sm:items-center mb-8 gap-4">
            <h1 class="text-xl font-medium flex items-center gap-2 text-stone-600 shrink-0">
                <i class="ph ph-timer text-2xl"></i> Pomodoro
            </h1>
            
            <div class="flex gap-2 overflow-x-auto w-full sm:justify-end no-scrollbar pb-1">
                <div class="relative flex items-center shrink-0" title="Cor de Fundo">
                    <input type="color" id="color-picker" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full z-10" value="#f5f5f4">
                    <button class="text-stone-400 hover:text-stone-600 p-2 rounded-full bg-stone-50"><i class="ph ph-paint-bucket text-xl"></i></button>
                </div>
                <div class="relative flex items-center shrink-0" title="Cor do Cartão">
                    <input type="color" id="card-color-picker" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full z-10" value="#ffffff">
                    <button class="text-stone-400 hover:text-stone-600 p-2 rounded-full bg-stone-50"><i class="ph ph-square text-xl"></i></button>
                </div>
                <div class="relative flex items-center shrink-0" title="Cor do Timer">
                    <input type="color" id="text-color-picker" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full z-10" value="#292524">
                    <button class="text-stone-400 hover:text-stone-600 p-2 rounded-full bg-stone-50"><i class="ph ph-text-t text-xl"></i></button>
                </div>
                <div class="w-px h-6 bg-stone-200 mx-1 self-center shrink-0"></div>
                <button id="notes-toggle" class="text-stone-400 hover:text-stone-600 p-2 rounded-full bg-stone-50"><i class="ph ph-notepad text-xl"></i></button>
                <button id="settings-toggle" class="text-stone-400 hover:text-stone-600 p-2 rounded-full bg-stone-50"><i class="ph ph-gear text-xl"></i></button>
                <button id="pip-toggle" class="text-stone-400 hover:text-stone-600 p-2 rounded-full bg-stone-50"><i class="ph ph-browsers text-xl"></i></button>
            </div>
        </header>

        <div class="flex p-1 bg-stone-100 rounded-full mb-6 w-full relative">
            <div id="mode-indicator" class="absolute top-1 bottom-1 left-1 bg-white rounded-full shadow-sm transition-all duration-300 ease-out" style="width: calc(33.33% - 6px); transform: translateX(0%);"></div>
            <button class="mode-btn relative z-10 flex-1 py-2 text-sm font-medium rounded-full text-stone-800" data-mode="pomodoro">Foco</button>
            <button class="mode-btn relative z-10 flex-1 py-2 text-sm font-medium rounded-full text-stone-500" data-mode="shortBreak">Pausa Curta</button>
            <button class="mode-btn relative z-10 flex-1 py-2 text-sm font-medium rounded-full text-stone-500" data-mode="longBreak">Pausa Longa</button>
        </div>

        <div class="w-full mb-6 text-center">
            <input type="text" id="task-input" placeholder="Em que vai focar-se?" class="w-full bg-stone-50/50 border border-stone-200 rounded-xl px-4 py-3 text-center focus:outline-none focus:ring-2 focus:ring-stone-400 font-medium">
        </div>

        <div class="text-[6rem] leading-none font-light tracking-tighter tabular-nums text-stone-800 mb-8" id="time-display">25:00</div>

        <div class="flex items-center gap-3 w-full mb-6">
            <button id="reset-btn" class="w-14 h-14 rounded-full bg-stone-100 text-stone-500 flex items-center justify-center"><i class="ph ph-arrow-counter-clockwise text-2xl"></i></button>
            <button id="main-btn" class="flex-1 h-14 rounded-full bg-stone-800 text-white font-medium flex items-center justify-center gap-2">
                <i class="ph-fill ph-play text-xl" id="main-btn-icon"></i> <span id="main-btn-text">INICIAR</span>
            </button>
            <button id="open-reminder-btn" class="w-14 h-14 rounded-full bg-purple-100 text-purple-700 flex items-center justify-center"><i class="ph ph-microphone text-2xl"></i></button>
        </div>
    </main>

    <aside id="notes-sidebar" class="fixed right-0 top-0 h-full w-full sm:w-[24rem] bg-white shadow-2xl border-l transform translate-x-full transition-transform duration-300 z-40 flex flex-col">
        <div class="p-4 border-b flex justify-between items-center bg-stone-50">
            <h2 class="font-medium flex items-center gap-2"><i class="ph ph-notepad"></i> Anotações</h2>
            <button id="close-notes" class="text-stone-400 p-2"><i class="ph ph-x text-xl"></i></button>
        </div>
        <div id="editor" contenteditable="true" placeholder="Escreva aqui..." class="flex-1 p-5 outline-none overflow-y-auto text-stone-700 text-2xl"></div>
    </aside>

    <div id="settings-modal" class="hidden fixed inset-0 bg-stone-900/50 z-50 flex items-center justify-center backdrop-blur-sm">
        <div class="bg-white p-8 rounded-[2rem] w-full max-w-sm shadow-xl">
            <h2 class="text-2xl font-medium mb-6">Ajustar Tempos</h2>
            <div class="space-y-4 mb-8">
                <div class="flex justify-between items-center"><label>Foco</label><input type="number" id="input-pomodoro" class="w-20 p-2 bg-stone-50 border rounded-xl text-center" value="25"></div>
                <div class="flex justify-between items-center"><label>Pausa Curta</label><input type="number" id="input-shortBreak" class="w-20 p-2 bg-stone-50 border rounded-xl text-center" value="5"></div>
                <div class="flex justify-between items-center"><label>Pausa Longa</label><input type="number" id="input-longBreak" class="w-20 p-2 bg-stone-50 border rounded-xl text-center" value="15"></div>
            </div>
            <div class="flex gap-3">
                <button id="cancel-settings" class="flex-1 py-3 rounded-xl bg-stone-100">Sair</button>
                <button id="save-settings" class="flex-1 py-3 rounded-xl bg-stone-800 text-white font-bold">Guardar</button>
            </div>
        </div>
    </div>

    <div id="create-reminder-modal" class="hidden fixed inset-0 bg-stone-900/60 z-50 flex items-center justify-center backdrop-blur-sm p-4">
        <div class="bg-white p-8 rounded-[2.5rem] w-full max-w-md shadow-2xl">
            <h2 class="text-xl font-bold mb-6 text-purple-700 flex items-center gap-2"><i class="ph ph-microphone-stage"></i> Novo Lembrete</h2>
            
            <input type="text" id="reminder-title" placeholder="Título do lembrete..." class="w-full bg-stone-50 border rounded-xl px-4 py-3 mb-4 outline-none focus:ring-2 focus:ring-purple-400">
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-6">
                <div>
                    <label class="text-[10px] uppercase font-bold text-stone-400 block mb-1">Em minutos:</label>
                    <input type="number" id="reminder-minutes" value="5" class="w-full bg-stone-50 border rounded-xl px-4 py-2.5 text-center font-bold" oninput="document.getElementById('reminder-datetime').value=''">
                </div>
                <div>
                    <label class="text-[10px] uppercase font-bold text-stone-400 block mb-1">Ou Data e Hora:</label>
                    <input type="datetime-local" id="reminder-datetime" class="w-full bg-stone-50 border rounded-xl px-2 py-2 text-[11px] font-bold" oninput="document.getElementById('reminder-minutes').value=''">
                </div>
            </div>

            <div class="bg-purple-50 p-6 rounded-3xl text-center mb-6 border border-purple-100">
                <button id="record-action-btn" class="bg-purple-600 text-white w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-3 shadow-lg"><i class="ph-fill ph-microphone text-3xl"></i></button>
                <p id="record-status" class="text-sm font-medium text-purple-800">Toque para gravar</p>
            </div>

            <div class="flex gap-3">
                <button id="cancel-reminder" class="flex-1 py-3 rounded-xl bg-stone-100 font-medium">Cancelar</button>
                <button id="save-reminder" class="flex-1 py-3 rounded-xl bg-purple-600 text-white font-bold disabled:opacity-50" disabled>Agendar</button>
            </div>
        </div>
    </div>

    <div id="trigger-reminder-modal" class="hidden fixed inset-0 bg-purple-900/95 z-[120] flex items-center justify-center text-white p-6">
        <div class="text-center flex flex-col items-center max-w-sm">
            <i class="ph ph-bell-ringing text-8xl mb-6 animate-bounce text-purple-200"></i>
            <h2 id="trigger-reminder-title" class="text-3xl font-bold mb-4">Título</h2>
            <audio id="trigger-reminder-audio" controls class="w-full mb-8"></audio>
            <button id="close-trigger-reminder" class="bg-white text-purple-900 px-10 py-4 rounded-2xl font-bold w-full shadow-2xl">Entendido</button>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) { 
            navigator.serviceWorker.register('./sw.js'); 
            Notification.requestPermission();
        }

        const MODES = { pomodoro: 25, shortBreak: 5, longBreak: 15 };
        let currentMode = 'pomodoro', timeLeft = MODES[currentMode] * 60, isRunning = false;
        let customColorActive = false, audioReminders = [];

        const timeDisplay = document.getElementById('time-display'), mainBtn = document.getElementById('main-btn');
        const appBody = document.getElementById('app-body'), mainCard = document.getElementById('main-card');
        const colorPicker = document.getElementById('color-picker'), cardColorPicker = document.getElementById('card-color-picker'), textColorPicker = document.getElementById('text-color-picker');

        // Worker para timer estável
        let timerWorker = null;
        function initWorker() {
            const blob = new Blob([`let i=null; self.onmessage=e=>{if(e.data==='s'){if(!i)i=setInterval(()=>self.postMessage('t'),1000);}else{clearInterval(i);i=null;}};`], {type:'text/javascript'});
            timerWorker = new Worker(URL.createObjectURL(blob));
            timerWorker.onmessage = () => { if(isRunning){ timeLeft--; updateDisplay(); if(timeLeft <= 0){ isRunning=false; timerWorker.postMessage('p'); alert("Tempo esgotado!"); resetTimer(); } } };
        }
        initWorker();

        function updateDisplay() {
            const m = Math.floor(timeLeft/60).toString().padStart(2,'0');
            const s = (timeLeft%60).toString().padStart(2,'0');
            timeDisplay.textContent = `${m}:${s}`;
        }

        // --- LEMBRETES ---
        let mediaRec, chunks = [], audioBase64 = null;

        document.getElementById('record-action-btn').onclick = async () => {
            if (!mediaRec || mediaRec.state === 'inactive') {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRec = new MediaRecorder(stream); chunks = [];
                mediaRec.ondataavailable = e => chunks.push(e.data);
                mediaRec.onstop = () => {
                    const reader = new FileReader();
                    reader.readAsDataURL(new Blob(chunks));
                    reader.onloadend = () => { audioBase64 = reader.result; document.getElementById('save-reminder').disabled = false; };
                };
                mediaRec.start(); document.getElementById('record-status').textContent = "A gravar...";
            } else {
                mediaRec.stop(); document.getElementById('record-status').textContent = "Pronto!";
                mediaRec.stream.getTracks().forEach(t => t.stop());
            }
        };

        document.getElementById('save-reminder').onclick = () => {
            const title = document.getElementById('reminder-title').value || "Lembrete de Voz";
            const dt = document.getElementById('reminder-datetime').value;
            const min = parseInt(document.getElementById('reminder-minutes').value);
            const triggerTime = dt ? new Date(dt).getTime() : Date.now() + (min * 60000);

            audioReminders.push({ id: Date.now(), title, audio: audioBase64, time: triggerTime });
            localStorage.setItem('pomo_reminders', JSON.stringify(audioReminders));
            
            audioBase64 = null; 
            document.getElementById('create-reminder-modal').classList.add('hidden');
        };

        setInterval(() => {
            const now = Date.now();
            audioReminders.forEach((rem, idx) => {
                if (now >= rem.time) {
                    document.getElementById('trigger-reminder-title').textContent = rem.title;
                    document.getElementById('trigger-reminder-audio').src = rem.audio;
                    document.getElementById('trigger-reminder-modal').classList.remove('hidden');
                    if (Notification.permission === "granted") {
                        new Notification("🎤 " + rem.title, { body: "Toque para ouvir a mensagem." });
                    }
                    audioReminders.splice(idx, 1);
                }
            });
        }, 5000);

        // --- EVENTOS UI ---
        mainBtn.onclick = () => {
            if (isRunning) { isRunning = false; timerWorker.postMessage('p'); mainBtn.innerHTML = '<i class="ph-fill ph-play text-xl"></i> INICIAR'; }
            else { isRunning = true; timerWorker.postMessage('s'); mainBtn.innerHTML = '<i class="ph-fill ph-pause text-xl"></i> PAUSAR'; }
        };

        function resetTimer() { isRunning = false; timerWorker.postMessage('p'); timeLeft = MODES[currentMode] * 60; updateDisplay(); mainBtn.innerHTML = '<i class="ph-fill ph-play text-xl"></i> INICIAR'; }
        document.getElementById('reset-btn').onclick = resetTimer;

        document.querySelectorAll('.mode-btn').forEach((btn, i) => btn.onclick = () => {
            currentMode = btn.dataset.mode;
            document.getElementById('mode-indicator').style.transform = `translateX(${i * 100}%)`;
            resetTimer();
        });

        // Cores e Modais
        colorPicker.oninput = (e) => appBody.style.backgroundColor = e.target.value;
        cardColorPicker.oninput = (e) => mainCard.style.backgroundColor = e.target.value;
        textColorPicker.oninput = (e) => timeDisplay.style.color = e.target.value;
        
        document.getElementById('notes-toggle').onclick = () => document.getElementById('notes-sidebar').classList.remove('translate-x-full');
        document.getElementById('close-notes').onclick = () => document.getElementById('notes-sidebar').classList.add('translate-x-full');
        document.getElementById('settings-toggle').onclick = () => document.getElementById('settings-modal').classList.remove('hidden');
        document.getElementById('cancel-settings').onclick = () => document.getElementById('settings-modal').classList.add('hidden');
        document.getElementById('open-reminder-btn').onclick = () => document.getElementById('create-reminder-modal').classList.remove('hidden');
        document.getElementById('cancel-reminder').onclick = () => document.getElementById('create-reminder-modal').classList.add('hidden');
        document.getElementById('close-trigger-reminder').onclick = () => document.getElementById('trigger-reminder-modal').classList.add('hidden');

        document.getElementById('save-settings').onclick = () => {
            MODES.pomodoro = parseInt(document.getElementById('input-pomodoro').value);
            MODES.shortBreak = parseInt(document.getElementById('input-shortBreak').value);
            MODES.longBreak = parseInt(document.getElementById('input-longBreak').value);
            document.getElementById('settings-modal').classList.add('hidden');
            resetTimer();
        };

        updateDisplay();
    </script>
</body>
</html>
